AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation template file for Mastodon (App server).
Parameters:
  Tag1Key:
    Description: Tag key
    Type: String
  Tag1Value:
    Description: Tag value
    Type: String
  Tag2Key:
    Description: Tag key
    Type: String
  Tag2Value:
    Description: Tag value
    Type: String
  InfraStackName:
    Description: Stack name of infrastructure.
    Type: String
  CookbookUrl:
    Description: URL of cookbook package.
    Type: String
  MastodonFQDN:
    Description: FQDN of mastodon
    Type: String
  EC2KeyPair:
    Description: Mastodon WebServer EC2 Key Pair Name
    Type: 'AWS::EC2::KeyPair::KeyName'
    ConstraintDescription: must be a valid EC2 Key Pair Name.
  PackageS3Bucket:
    Description: S3 bucket name for Mastodon pre-build package.
    Type: String
    ConstraintDescription: must be a valid S3 bucket name.
  PackageS3Prefix:
    Description: S3 folder name for Mastodon pre-build package.
    Type: String
    ConstraintDescription: must be a valid S3 key name.
  PackageName:
    Description: File name for Mastodon pre-build package.
    Type: String
    ConstraintDescription: must be a valid file name.
  ContentsS3Bucket:
    Description: S3 bucket name of content cache.
    Type: String
    ConstraintDescription: must be a valid S3 bucket name.
  LBAccessLogS3Bucket:
    Description: S3 bucket name of access log of load balancer.
    Type: String
    ConstraintDescription: must be a valid S3 bucket name.
  LBAccessLogPrefix:
    Description: Prefix of access log of load balancer.
    Type: String
  CertArn:
    Description: ARN of server certificate on ACM.
    Type: String
    ConstraintDescription: must be a valid ACM ARN.

Mappings:
  CIDR:
    VPC:
      IP: 10.0.0.0/16
    PrivateSubnet1:
      IP: 10.0.10.0/24
    PrivateSubnet2:
      IP: 10.0.11.0/24
    PublicSubnet1:
      IP: 10.0.20.0/24
    PublicSubnet2:
      IP: 10.0.21.0/24
    All:
      IP: 0.0.0.0/0
  InstanceConfig:
    Storage:
      ValueByGb: '20'
Conditions:
  IsVirginia: !Equals 
    - !Ref 'AWS::Region'
    - us-east-1
Resources:
  AppServerInstanceIAMRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: 's3:*'
                Resource: !Sub arn:aws:s3:::${ContentsS3Bucket}
              - Effect: Allow
                Action: 's3:*'
                Resource: !Sub arn:aws:s3:::${ContentsS3Bucket}/*
              - Effect: Allow
                Action: 's3:*'
                Resource: !Sub arn:aws:s3:::${PackageS3Bucket}
              - Effect: Allow
                Action: 's3:*'
                Resource: !Sub arn:aws:s3:::${PackageS3Bucket}/*
              - Effect: Allow
                Action:
                  - elasticloadbalancing:RegisterTargets
                  - elasticloadbalancing:DeregisterTargets
                  - elasticloadbalancing:DescribeTargetHealth
                Resource: '*'
              - Effect: Allow
                Action: 'acm:*'
                Resource: !Ref CertArn
  AppServerInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Roles:
        - !Ref AppServerInstanceIAMRole

  AppServerApplicationLoadBalancerTargetGroupHttp:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      HealthCheckIntervalSeconds: 60
      HealthCheckPath: /about
      HealthCheckPort: '80'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: 200-399
      Name: !Sub ${AWS::StackName}-alb-tg
      Port: 80
      Protocol: HTTP
      Tags:
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: 'true'
        - Key: stickiness.type
          Value: lb_cookie
      VpcId: !ImportValue 
        'Fn::Sub': '${InfraStackName}-VPC'
  AppServerApplicationLoadBalancer:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: true
        - Key: access_logs.s3.bucket
          Value: !Ref LBAccessLogS3Bucket
        - Key: access_logs.s3.prefix
          Value: !Ref LBAccessLogPrefix
      Name: !Join 
        - '-'
        - - !Ref 'AWS::StackName'
          - instance
          - alb
      Scheme: internet-facing
      SecurityGroups:
        - !ImportValue 
          'Fn::Sub': '${InfraStackName}-SecurityGroupMastodonInstance'
      Subnets:
        - !ImportValue 
          'Fn::Sub': '${InfraStackName}-PublicSubnet1'
        - !ImportValue 
          'Fn::Sub': '${InfraStackName}-PublicSubnet2'
      Tags:
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      IpAddressType: dualstack
  AppServerApplicationLoadBalancerListenerHttps:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      Certificates:
        - CertificateArn: !Ref CertArn
      DefaultActions:
        - TargetGroupArn: !Ref AppServerApplicationLoadBalancerTargetGroupHttp
          Type: forward
      LoadBalancerArn: !Ref AppServerApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      # SslPolicy: ELBSecurityPolicy-2016-08
  AppServerApplicationLoadBalancerListenerHttp:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref AppServerApplicationLoadBalancerTargetGroupHttp
          Type: forward
      LoadBalancerArn: !Ref AppServerApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  OpsWorksServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - opsworks.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: opsworks-service
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'ec2:*'
                  - 'iam:PassRole'
                  - 'cloudwatch:GetMetricStatistics'
                  - 'elasticloadbalancing:*'
                Resource: '*'

  AppServerOpsWorksStack:
    Type: AWS::OpsWorks::Stack
    Properties:
      AgentVersion: 'LATEST'
      ConfigurationManager: 
        Name: 'Chef'
        Version: '12'
      CustomCookbooksSource: 
        Username:
          !ImportValue 
            'Fn::Sub': '${InfraStackName}-AWSAccessKey'
        Password:
          !ImportValue 
            'Fn::Sub': '${InfraStackName}-AWSAccessSecret'
        Type: 's3'
        Url: !Ref CookbookUrl
      CustomJson:
        server:
          package:
            package_name: !Ref PackageName
            s3_bucket: !Ref PackageS3Bucket
            s3_prefix: !Ref PackageS3Prefix
          federation:
            local_domain: !Ref MastodonFQDN
        user:
          shell: "/bin/bash"
          home: "/home/mastodon"
      DefaultAvailabilityZone: 
        !ImportValue
          'Fn::Sub': '${InfraStackName}-SubnetAvailabilityZone1'
      DefaultSubnetId:
        !ImportValue
          'Fn::Sub': '${InfraStackName}-PrivateSubnet1'
      DefaultInstanceProfileArn: !GetAtt [ AppServerInstanceProfile, Arn ]
      DefaultOs: 'Ubuntu 18.04 LTS'
      DefaultRootDeviceType: 'ebs'
      DefaultSshKeyName: !Ref EC2KeyPair
      HostnameTheme: 'Wild_Cats'
      Name: !Sub '${AWS::StackName}-Stack'
      ServiceRoleArn: !GetAtt [ OpsWorksServiceRole, Arn ]
      Tags:
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      UseCustomCookbooks: true
      UseOpsworksSecurityGroups: false
      VpcId:
        !ImportValue
          'Fn::Sub': '${InfraStackName}-VPC'

  AppServerOpsWorksLayer:
    Type: AWS::OpsWorks::Layer
    Properties:
      AutoAssignElasticIps: false
      AutoAssignPublicIps: false
      CustomInstanceProfileArn: !GetAtt [ AppServerInstanceProfile, Arn ]
      CustomJson:
        alb_helper:
          target_group_arn: !Ref AppServerApplicationLoadBalancerTargetGroupHttp
          connection_draining_timeout: 750
          state_check_frequency: 30
      CustomRecipes:
        Setup:
          - pkg_install
          - alb_support::attach_to_alb
          - add_user
        Deploy:
          - download_precompiled
          - setup_nginx
          - setup_mastodon_service
        Shutdown:
        - alb_support::detach_from_alb
      CustomSecurityGroupIds: 
        - !ImportValue
            'Fn::Sub': '${InfraStackName}-SecurityGroupMastodonInstance'
      EnableAutoHealing: true
      InstallUpdatesOnBoot: true
      Name: !Sub '${AWS::StackName}-Layer'
      Shortname: 'appserver'
      StackId: !Ref AppServerOpsWorksStack
      Tags: 
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      Type: custom
      UseEbsOptimizedInstances: true

Outputs:
  MastodonServerHostName:
    Description: Host name of Mastodon server
    Value: !GetAtt 
      - AppServerApplicationLoadBalancer
      - DNSName
  AppServerOpsWorksStack:
    Value: !Ref AppServerOpsWorksStack
    Export:
      Name: !Sub "${AWS::StackName}-AppServerOpsWorksStack"
  AppServerOpsWorksLayer:
    Value: !Ref AppServerOpsWorksLayer
    Export:
      Name: !Sub "${AWS::StackName}-AppServerOpsWorksLayer"

