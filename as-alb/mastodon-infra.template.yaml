                Resource: !Join 
                  - ''
                  - - 'arn:aws:s3:::'
                    - !Ref PackageS3Bucket
                    - /*
  BastionInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Roles:
        - !Ref BastionInstanceIAMRole
  BastionInstanceNetworkIF:
    Type: 'AWS::EC2::NetworkInterface'
    Properties:
      Description: Bastion instance network interface.
      GroupSet:
        - !Ref SecurityGroupBastionInstance
      SourceDestCheck: true
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-BastionNetworkIF'
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
  BastionInstance:
    Type: 'AWS::EC2::Instance'
    DependsOn: VPCGatewayAttachment
    Properties:
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            VolumeSize: !FindInMap 
              - InstanceConfig
              - Storage
              - ValueByGb
      DisableApiTermination: false
      IamInstanceProfile: !Ref BastionInstanceProfile
      ImageId: !Ref BastionInstanceAMI
      InstanceInitiatedShutdownBehavior: stop
      InstanceType: !Ref BastionInstanceType
      KeyName: !Ref EC2KeyPair
      Monitoring: true
      NetworkInterfaces:
        - Description: Mastodon Network Interface.
          DeviceIndex: '0'
          NetworkInterfaceId: !Ref BastionInstanceNetworkIF
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Bastion'
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      UserData: !Base64 
        'Fn::Join':
          - ''
          - - |
              #!/bin/bash -xe
            - |
              # ********** Install packages for cloud formation **********
            - |
              export HOME=/root 
            - |
              apt-get update 
            - |
              apt-get -y install python-pip python-setuptools 
            - |
              pip install --upgrade pip 
            - |
              cd /root 
            - |
              mkdir aws-cfn-bootstrap-latest
            - >-
              curl
              https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-latest.tar.gz
              |
            - |2
                tar xz -C aws-cfn-bootstrap-latest --strip-components 1 
            - |
              easy_install aws-cfn-bootstrap-latest
            - >
              ln -s /root/aws-cfn-bootstrap-latest/init/ubuntu/cfn-hup
              /etc/init.d/cfn-hup 
            - |
              # ********** Install required packages **********
            - |
              curl -sL https://deb.nodesource.com/setup_6.x | bash - 
            - |
              apt-add-repository -y ppa:brightbox/ruby-ng
            - |
              apt-get update
            - '/usr/local/bin/cfn-init -v '
            - ' --stack '
            - !Ref 'AWS::StackName'
            - ' --resource BastionInstance '
            - ' --configsets installPackages '
            - ' --region '
            - !Ref 'AWS::Region'
            - |+

            - |
              npm install -g yarn 
            - |
              # ********** Add user **********
            - |
              useradd -d /home/mastodon --create-home --user-group mastodon
            - |
              # ********** Build Mastodon **********
            - |
              cd /home/mastodon 
            - 'git clone https://github.com/tootsuite/mastodon.git '
            - !Ref MastodonFQDN
            - |2
               
            - 'cd '
            - !Ref MastodonFQDN
            - |2
               
            - !If 
              - IsMaster
              - ''
              - !Sub |
                git checkout ${MastodonVersion} 
            - |
              gem install bundler 
            - |
              bundle install --deployment --without development test 
            - |
              yarn install --pure-lockfile 
            - |
              # ********** Setup Mastodon **********
            - '/usr/local/bin/cfn-init -v '
            - ' --stack '
            - !Ref 'AWS::StackName'
            - ' --resource BastionInstance '
            - ' --configsets createMastodonConfig '
            - ' --region '
            - !Ref 'AWS::Region'
            - |+

            - |
              export RAILS_ENV=production
            - !If 
              - HasSecretKeyBase
              - !Sub |
                echo "SECRET_KEY_BASE=${SecretKeyBase}" >> .env.production
              - >
                echo "SECRET_KEY_BASE=`bundle exec rake secret`" >>
                .env.production
            - !If 
              - HasPaperclipSecret
              - !Sub |
                echo "PAPERCLIP_SECRET=${PaperclipSecret}" >> .env.production
              - >
                echo "PAPERCLIP_SECRET=`bundle exec rake secret`" >>
                .env.production
            - !If 
              - HasOtpSecret
              - !Sub |
                echo "OTP_SECRET=${OtpSecret}" >> .env.production
              - |
                echo "OTP_SECRET=`bundle exec rake secret`" >> .env.production
            - >
              bundle exec rake mastodon:webpush:generate_vapid_key >>
              .env.production
            - !If 
              - HasDBSnapshotIdentifier
              - ''
              - |
                bundle exec rails db:setup
            - |
              bundle exec rails assets:precompile
            - |
              cd .. 
            - 'tar cfz '
            - !Ref PackageName
            - ' '
            - !Ref MastodonFQDN
            - |2
               
            - !Sub >
              aws s3 cp ${PackageName}
              s3://${PackageS3Bucket}/${PackageS3Prefix}/${PackageName} 
            - |
              # ********** Notify **********
            - '/usr/local/bin/cfn-signal '
            - ' -e 0'
            - ' --stack '
            - !Ref 'AWS::StackName'
            - ' --resource BastionInstance'
            - ' --region '
            - !Ref 'AWS::Region'
            - |+

            - |
              # ********** The End **********
    CreationPolicy:
      ResourceSignal:
        Timeout: PT30M
    Metadata:
      'AWS::CloudFormation::Init':
        configSets:
          installPackages:
            - aptPackages
          createMastodonConfig:
            - createMastodonConfig
            - moveMastodonConfig
        aptPackages:
          packages:
            apt:
              imagemagick: []
              ffmpeg: []
              libpq-dev: []
              libxml2-dev: []
              libxslt1-dev: []
              file: []
              git: []
              curl: []
              gcc: []
              g++: []
              pkg-config: []
              libprotobuf-dev: []
              protobuf-compiler: []
              ruby2.5: []
              ruby2.5-dev: []
              make: []
              postgresql-client: []
              redis-tools: []
              nginx: []
              awscli: []
              nodejs: []
              libicu-dev: []
              libidn11-dev: []
        createMastodonConfig:
          files:
            /home/mastodon/.env.production:
              content: !Join 
                - ''
                - - |
                    # GENERATED BY CLOUD FORMATION TEMPLATE
                  - |
                    # Redis
                  - |
                    # You may set REDIS_URL instead for more advanced options
                  - REDIS_HOST=
                  - !GetAtt 
                    - ElastiCacheCluster
                    - RedisEndpoint.Address
                  - |+

                  - REDIS_PORT=
                  - !GetAtt 
                    - ElastiCacheCluster
                    - RedisEndpoint.Port
                  - |+

                  - |
                    # You may set DATABASE_URL instead for more advanced options
                  - |
                    # Database
                  - DB_HOST=
                  - !GetAtt 
                    - RDSInstance
                    - Endpoint.Address
                  - |+

                  - DB_NAME=
                  - !Ref DBName
                  - |+

                  - DB_USER=
                  - !Ref DBMasterUsername
                  - |+

                  - DB_PASS=
                  - !Ref DBMasterUserPassword
                  - |+

                  - DB_PORT=
                  - !GetAtt 
                    - RDSInstance
                    - Endpoint.Port
                  - |+

                  - |
                    # Domain
                  - LOCAL_DOMAIN=
                  - !Ref MastodonFQDN
                  - |+

                  - |
                    LOCAL_HTTPS=true
                  - |
                    # Mail
                  - SMTP_SERVER=
                  - !Ref SMTPHostName
                  - |+

                  - SMTP_PORT=
                  - !Ref SMTPHostPort
                  - |+

                  - SMTP_LOGIN=
                  - !Ref SMTPUserName
                  - |+

                  - SMTP_PASSWORD=
                  - !Ref SMTPPassword
                  - |+

                  - SMTP_FROM_ADDRESS=
                  - !Ref SMTPSenderAddress
                  - |+

                  - |
                    # Aws
                  - |
                    S3_ENABLED=true
                  - S3_BUCKET=
                  - !Ref ContentsS3Bucket
                  - |+

                  - AWS_ACCESS_KEY_ID=
                  - !Ref ContentsAWSAccessKey
                  - |+

                  - AWS_SECRET_ACCESS_KEY=
                  - !Ref ContentsAWSAccessSecret
                  - |+

                  - S3_REGION=
                  - !Ref 'AWS::Region'
                  - |+

                  - |
                    S3_PROTOCOL=https
                  - S3_HOSTNAME=
                  - !If 
                    - IsVirginia
                    - s3.amazonaws.com
                    - !Join 
                      - ''
                      - - s3-
                        - !Ref 'AWS::Region'
                        - .amazonaws.com
                  - |+

                  - |
                    # Option
                  - |
                    # SINGLE_USER_MODE=true
                  - |
                    # Cluster number setting for streaming API server.
                  - >
                    # If you comment out following line, cluster number will be
                    `numOfCpuCores - 1`.
                  - |
                    STREAMING_CLUSTER_NUM=1
                  - |
                    # Secrets
              mode: '000644'
              owner: root
              group: root
        moveMastodonConfig:
          commands:
            001_moveFile:
              command: !Sub 'mv .env.production ${MastodonFQDN}/.env.production'
              cwd: /home/mastodon
