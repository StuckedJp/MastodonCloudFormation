AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation template file for Mastodon (Infrastructure layer).
Parameters:
  Tag1Key:
    Description: Tag key
    Type: String
  Tag1Value:
    Description: Tag value
    Type: String
  Tag2Key:
    Description: Tag key
    Type: String
  Tag2Value:
    Description: Tag value
    Type: String
  MastodonFQDN:
    Description: FQDN of Mastodon instance
    Type: String
  MastodonVersion:
    Description: Release tag name of Mastodon
    Type: String
  SecretKeyBase:
    Description: SECRET_KEY_BASE value.
    Type: String
  PaperclipSecret:
    Description: PAPERCLIP_SECRET value.
    Type: String
  OtpSecret:
    Description: OTP_SECRET value.
    Type: String
  SubnetAvailabilityZone:
    Description: Availability Zones of Subnet
    Type: 'List<AWS::EC2::AvailabilityZone::Name>'
  DBInstanceClass:
    Description: RDS instance type
    Type: String
    Default: db.t2.micro
    AllowedValues:
      - db.m4.large
      - db.m4.xlarge
      - db.m4.2xlarge
      - db.m4.4xlarge
      - db.m4.10xlarge
      - db.m3.medium
      - db.m3.large
      - db.m3.xlarge
      - db.m3.2xlarge
      - db.r3.large
      - db.r3.xlarge
      - db.r3.2xlarge
      - db.r3.4xlarge
      - db.r3.8xlarge
      - db.t2.micro
      - db.t2.small
      - db.t2.medium
      - db.t2.large
    ConstraintDescription: must be a valid RDS instance type.
  DBName:
    Description: Database schema name
    Type: String
  DBEngineVersion:
    Description: RDS (Postgresql) engine version
    Type: String
    AllowedValues:
      - 9.6.6
      - 9.6.5
      - 9.6.3
      - 9.6.2
      - 9.6.1
    ConstraintDescription: must be a valid RDS engine version.
  DBLicenseModel:
    Description: RDS (Postgresql) engine license model
    Type: String
    Default: postgresql-license
    AllowedValues:
      - postgresql-license
    ConstraintDescription: must be a valid RDS license model.
  DBMasterUsername:
    Description: Database master user name
    Type: String
  DBMasterUserPassword:
    Description: Database master user password
    Type: String
  DBStorageType:
    Description: RDS (Postgresql) storage type
    Type: String
    Default: standard
    AllowedValues:
      - standard
      - gp2
      - io1
    ConstraintDescription: must be a valid RDS storage type.
  DBSnapshotIdentifier:
    Description: RDS Snapshot ID
    Type: String
    ConstraintDescription: must be a valid RDS storage type.
  ElastiCacheNodeType:
    Description: ElastiCache node type
    Type: String
    Default: cache.t2.micro
    AllowedValues:
      - cache.t2.micro
      - cache.t2.small
      - cache.t2.medium
      - cache.m3.medium
      - cache.m3.large
      - cache.m3.xlarge
      - cache.m3.2xlarge
      - cache.m4.large
      - cache.m4.xlarge
      - cache.m4.2xlarge
      - cache.m4.4xlarge
      - cache.m4.10xlarge
      - cache.r3.large
      - cache.r3.xlarge
      - cache.r3.2xlarge
      - cache.r3.4xlarge
      - cache.r3.8xlarge
  ElastiCacheVersion:
    Description: ElastiCache (Redis) engine version
    Type: String
    AllowedValues:
      - 3.2.4
      - 2.8.24
      - 2.8.23
      - 2.8.22
      - 2.8.21
      - 2.8.19
      - 2.8.6
      - 2.6.13
    ConstraintDescription: must be a valid Elasticache engine version.
  BastionInstanceType:
    Description: EC2 instance type of bastion server
    Type: String
    Default: t2.micro
    AllowedValues:
      - t1.micro
      - t2.nano
      - t2.micro
      - t2.small
      - t2.medium
      - t2.large
      - m1.small
      - m1.medium
      - m1.large
      - m1.xlarge
      - m2.xlarge
      - m2.2xlarge
      - m2.4xlarge
      - m3.medium
      - m3.large
      - m3.xlarge
      - m3.2xlarge
      - m4.large
      - m4.xlarge
      - m4.2xlarge
      - m4.4xlarge
      - m4.10xlarge
      - c1.medium
      - c1.xlarge
      - c3.large
      - c3.xlarge
      - c3.2xlarge
      - c3.4xlarge
      - c3.8xlarge
      - c4.large
      - c4.xlarge
      - c4.2xlarge
      - c4.4xlarge
      - c4.8xlarge
      - g2.2xlarge
      - g2.8xlarge
      - r3.large
      - r3.xlarge
      - r3.2xlarge
      - r3.4xlarge
      - r3.8xlarge
      - i2.xlarge
      - i2.2xlarge
      - i2.4xlarge
      - i2.8xlarge
      - d2.xlarge
      - d2.2xlarge
      - d2.4xlarge
      - d2.8xlarge
      - hi1.4xlarge
      - hs1.8xlarge
      - cr1.8xlarge
      - cc2.8xlarge
      - cg1.4xlarge
    ConstraintDescription: must be a valid EC2 instance type.
  BastionInstanceAMI:
    Description: EC2 instance AMI ID of bastion server.
    Type: 'AWS::EC2::Image::Id'
    ConstraintDescription: must be a valid EC2 AMI ID.
  EC2KeyPair:
    Description: EC2 Key Pair Name
    Type: 'AWS::EC2::KeyPair::KeyName'
    ConstraintDescription: must be a valid EC2 Key Pair Name.
  NATInstanceType:
    Description: EC2 instance type of NAT instance.
    Type: String
    Default: t2.micro
    AllowedValues:
      - t1.micro
      - t2.nano
      - t2.micro
      - t2.small
      - t2.medium
      - t2.large
      - m1.small
      - m1.medium
      - m1.large
      - m1.xlarge
      - m2.xlarge
      - m2.2xlarge
      - m2.4xlarge
      - m3.medium
      - m3.large
      - m3.xlarge
      - m3.2xlarge
      - m4.large
      - m4.xlarge
      - m4.2xlarge
      - m4.4xlarge
      - m4.10xlarge
      - c1.medium
      - c1.xlarge
      - c3.large
      - c3.xlarge
      - c3.2xlarge
      - c3.4xlarge
      - c3.8xlarge
      - c4.large
      - c4.xlarge
      - c4.2xlarge
      - c4.4xlarge
      - c4.8xlarge
      - g2.2xlarge
      - g2.8xlarge
      - r3.large
      - r3.xlarge
      - r3.2xlarge
      - r3.4xlarge
      - r3.8xlarge
      - i2.xlarge
      - i2.2xlarge
      - i2.4xlarge
      - i2.8xlarge
      - d2.xlarge
      - d2.2xlarge
      - d2.4xlarge
      - d2.8xlarge
      - hi1.4xlarge
      - hs1.8xlarge
      - cr1.8xlarge
      - cc2.8xlarge
      - cg1.4xlarge
    ConstraintDescription: must be a valid EC2 instance type.
  PackageS3Bucket:
    Description: S3 bucket name for Mastodon pre-build package.
    Type: String
    ConstraintDescription: must be a valid S3 bucket name.
  PackageS3Prefix:
    Description: S3 folder name for Mastodon pre-build package.
    Type: String
    ConstraintDescription: must be a valid S3 key name.
  PackageName:
    Description: File name for Mastodon pre-build package.
    Type: String
    ConstraintDescription: must be a valid file name.
  ContentsS3Bucket:
    Description: S3 bucket name of content cache.
    Type: String
    ConstraintDescription: must be a valid S3 bucket name.
  ContentsAWSAccessKey:
    Description: AWSAccessKey for S3 access.
    Type: String
  ContentsAWSAccessSecret:
    Description: AWSAccessSecret for S3 access.
    Type: String
  LBAccessLogS3Bucket:
    Description: S3 bucket name of access log of load balancer.
    Type: String
    ConstraintDescription: must be a valid S3 bucket name.
  LBAccessLogPrefix:
    Description: Prefix of access log of load balancer.
    Type: String
  SMTPHostName:
    Description: SMTP host name.
    Type: String
  SMTPHostPort:
    Description: SMTP host port number.
    Default: '587'
    Type: Number
  SMTPUserName:
    Description: SMTP user name.
    Type: String
  SMTPPassword:
    Description: SMTP user password.
    Type: String
  SMTPSenderAddress:
    Description: E-mail address of mail sender.
    Type: String
    ConstraintDescription: must be a valid e-mail address.
Mappings:
  CIDR:
    VPC:
      IP: 10.0.0.0/16
    PrivateSubnet1:
      IP: 10.0.10.0/24
    PrivateSubnet2:
      IP: 10.0.11.0/24
    PublicSubnet1:
      IP: 10.0.20.0/24
    PublicSubnet2:
      IP: 10.0.21.0/24
    All:
      IP: 0.0.0.0/0
  RDSConfig:
    Port:
      Value: '5432'
    Storage:
      ValueByGb: '20'
    BackupRetentionPeriod:
      Value: '3'
  ElastiCacheConfig:
    Port:
      Value: '6379'
    SnapshotRetentionLimit:
      Value: '3'
    SnapshotWindow:
      Value: '05:00-09:00'
  InstanceConfig:
    Storage:
      ValueByGb: '20'
  RegionConfig:
    us-east-1:
      Principal: '127311923021'
      NATAMI: ami-d4c5efc2
    us-east-2:
      Principal: 033677994240
      NATAMI: ami-f27b5a97
    us-west-1:
      Principal: 027434742980
      NATAMI: ami-b87f53d8
    us-west-2:
      Principal: '797873946194'
      NATAMI: ami-8bfce8f2
    ca-central-1:
      Principal: '985666609251'
      NATAMI: ami-b0a619d4
    eu-west-1:
      Principal: '156460612806'
      NATAMI: ami-3a849f5c
    eu-central-1:
      Principal: 054676820928
      NATAMI: ami-9ebe18f1
    eu-west-2:
      Principal: '652711504416'
      NATAMI: ami-21120445
    ap-northeast-1:
      Principal: '582318560864'
      NATAMI: ami-10dfc877
    ap-northeast-2:
      Principal: '600734575887'
      NATAMI: ami-1a1bc474
    ap-southeast-1:
      Principal: '114774131450'
      NATAMI: ami-36af2055
    ap-southeast-2:
      Principal: '783225319266'
      NATAMI: ami-1e91817d
    ap-south-1:
      Principal: '718504428378'
      NATAMI: ami-e0215f8f
    sa-east-1:
      Principal: '507241528517'
      NATAMI: ami-8bdab1e7
    us-gov-west-1:
      Principal: 048591011584
      NATAMI: ami-c39610a2
    cn-north-1:
      Principal: '638102146993'
      NATAMI: ami-e1f7268c
Conditions:
  IsVirginia: !Equals 
    - !Ref 'AWS::Region'
    - us-east-1
  IsMaster: !Equals 
    - !Ref MastodonVersion
    - ''
  HasSecretKeyBase: !Not 
    - !Equals 
      - !Ref SecretKeyBase
      - ''
  HasPaperclipSecret: !Not 
    - !Equals 
      - !Ref PaperclipSecret
      - ''
  HasOtpSecret: !Not 
    - !Equals 
      - !Ref OtpSecret
      - ''
  HasDBSnapshotIdentifier: !Not 
    - !Equals 
      - !Ref DBSnapshotIdentifier
      - ''
Resources:
  LbAccessLogBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref LBAccessLogS3Bucket
      PolicyDocument:
        Id: Policy1493789607994
        Version: 2012-10-17
        Statement:
          - Sid: Stmt1493789603166
            Action: 's3:PutObject'
            Effect: Allow
            Resource: !Sub >-
              arn:aws:s3:::${LBAccessLogS3Bucket}/${LBAccessLogPrefix}/AWSLogs/${AWS::AccountId}/*
            Principal:
              AWS:
                - !FindInMap 
                  - RegionConfig
                  - !Ref 'AWS::Region'
                  - Principal
  VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - VPC
        - IP
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-VPC'
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
  InternetGW:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-INetGW'
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
  VPCGatewayAttachment:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      InternetGatewayId: !Ref InternetGW
      VpcId: !Ref VPC
  VPCRouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-VPCRouteTable'
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
  VPCRouteTableRoute:
    Type: 'AWS::EC2::Route'
    DependsOn: VPCGatewayAttachment
    Properties:
      DestinationCidrBlock: !FindInMap 
        - CIDR
        - All
        - IP
      GatewayId: !Ref InternetGW
      RouteTableId: !Ref VPCRouteTable
  PrivateSubnet1:
    Type: 'AWS::EC2::Subnet'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - PrivateSubnet1
        - IP
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select 
        - '0'
        - !Ref SubnetAvailabilityZone
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-PrivateSubnet1'
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      VpcId: !Ref VPC
  PrivateSubnet2:
    Type: 'AWS::EC2::Subnet'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - PrivateSubnet2
        - IP
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select 
        - '1'
        - !Ref SubnetAvailabilityZone
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-PrivateSubnet2'
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      VpcId: !Ref VPC
  PublicSubnet1:
    Type: 'AWS::EC2::Subnet'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - PublicSubnet1
        - IP
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select 
        - '0'
        - !Ref SubnetAvailabilityZone
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-PublicSubnet1'
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      VpcId: !Ref VPC
  PublicSubnet2:
    Type: 'AWS::EC2::Subnet'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - PublicSubnet2
        - IP
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select 
        - '1'
        - !Ref SubnetAvailabilityZone
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-PublicSubnet2'
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      VpcId: !Ref VPC
  PublicSubnetNetworkAcl:
    Type: 'AWS::EC2::NetworkAcl'
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-PublicSubnetNetworkAcl'
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      VpcId: !Ref VPC
  PublicSubnetNetworkAclEntryIngressHttp:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - All
        - IP
      Egress: false
      NetworkAclId: !Ref PublicSubnetNetworkAcl
      PortRange:
        From: 80
        To: 80
      Protocol: 6
      RuleAction: allow
      RuleNumber: 110
  PublicSubnetNetworkAclEntryIngressHttps:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - All
        - IP
      Egress: false
      NetworkAclId: !Ref PublicSubnetNetworkAcl
      PortRange:
        From: 443
        To: 443
      Protocol: 6
      RuleAction: allow
      RuleNumber: 120
  PublicSubnetNetworkAclEntryIngressSSH:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - All
        - IP
      Egress: false
      NetworkAclId: !Ref PublicSubnetNetworkAcl
      PortRange:
        From: 22
        To: 22
      Protocol: 6
      RuleAction: allow
      RuleNumber: 130
  PublicSubnetNetworkAclEntryIngressConnectBack:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - All
        - IP
      Egress: false
      NetworkAclId: !Ref PublicSubnetNetworkAcl
      PortRange:
        From: 1024
        To: 65535
      Protocol: 6
      RuleAction: allow
      RuleNumber: 190
  PublicSubnetNetworkAclEntryIngressICMP:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - All
        - IP
      Egress: false
      Icmp:
        Code: -1
        Type: -1
      NetworkAclId: !Ref PublicSubnetNetworkAcl
      Protocol: 1
      RuleAction: allow
      RuleNumber: 200
  PublicSubnetNetworkAclEntryIngressPrivateSubnet1:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - PrivateSubnet1
        - IP
      Egress: false
      NetworkAclId: !Ref PublicSubnetNetworkAcl
      Protocol: -1
      RuleAction: allow
      RuleNumber: 300
  PublicSubnetNetworkAclEntryIngressPrivateSubnet2:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - PrivateSubnet2
        - IP
      Egress: false
      NetworkAclId: !Ref PublicSubnetNetworkAcl
      Protocol: -1
      RuleAction: allow
      RuleNumber: 310
  PublicSubnetNetworkAclEntryEgress:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - All
        - IP
      Egress: true
      NetworkAclId: !Ref PublicSubnetNetworkAcl
      Protocol: -1
      RuleAction: allow
      RuleNumber: 100
  PublicSubnet1RouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      RouteTableId: !Ref VPCRouteTable
      SubnetId: !Ref PublicSubnet1
  PublicSubnet2RouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      RouteTableId: !Ref VPCRouteTable
      SubnetId: !Ref PublicSubnet2
  PrivateSubnetNetworkAcl:
    Type: 'AWS::EC2::NetworkAcl'
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-PrivateSubnetNetworkAcl'
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      VpcId: !Ref VPC
  PrivateSubnet1NetworkAclEntryIngress:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - PublicSubnet1
        - IP
      Egress: false
      NetworkAclId: !Ref PrivateSubnetNetworkAcl
      Protocol: -1
      RuleAction: allow
      RuleNumber: 100
  PrivateSubnet2NetworkAclEntryIngress:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - PublicSubnet2
        - IP
      Egress: false
      NetworkAclId: !Ref PrivateSubnetNetworkAcl
      Protocol: -1
      RuleAction: allow
      RuleNumber: 110
  PrivateSubnetNetworkAclEntryIngressConnectBack:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - All
        - IP
      Egress: false
      NetworkAclId: !Ref PrivateSubnetNetworkAcl
      PortRange:
        From: 1024
        To: 65535
      Protocol: 6
      RuleAction: allow
      RuleNumber: 190
  PrivateSubnetNetworkAclEntryEgress:
    Type: 'AWS::EC2::NetworkAclEntry'
    Properties:
      CidrBlock: !FindInMap 
        - CIDR
        - All
        - IP
      Egress: true
      NetworkAclId: !Ref PrivateSubnetNetworkAcl
      Protocol: -1
      RuleAction: allow
      RuleNumber: 100
  PrivateSubnet1ToNetworkACL:
    Type: 'AWS::EC2::SubnetNetworkAclAssociation'
    Properties:
      SubnetId: !Ref PrivateSubnet1
      NetworkAclId: !Ref PrivateSubnetNetworkAcl
  PrivateSubnet2ToNetworkACL:
    Type: 'AWS::EC2::SubnetNetworkAclAssociation'
    Properties:
      SubnetId: !Ref PrivateSubnet2
      NetworkAclId: !Ref PrivateSubnetNetworkAcl
  PublicSubnet1ToNetworkACL:
    Type: 'AWS::EC2::SubnetNetworkAclAssociation'
    Properties:
      SubnetId: !Ref PublicSubnet1
      NetworkAclId: !Ref PublicSubnetNetworkAcl
  PublicSubnet2ToNetworkACL:
    Type: 'AWS::EC2::SubnetNetworkAclAssociation'
    Properties:
      SubnetId: !Ref PublicSubnet2
      NetworkAclId: !Ref PublicSubnetNetworkAcl
  SecurityGroupBastionInstance:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Security Group for bastion Instance Host
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-SecurityGroupBastion'
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      VpcId: !Ref VPC
  SecurityGroupBastionInstanceIngressSSH:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      CidrIp: !FindInMap 
        - CIDR
        - All
        - IP
      FromPort: 22
      ToPort: 22
      GroupId: !Ref SecurityGroupBastionInstance
      IpProtocol: tcp
  SecurityGroupBastionInstanceEgress:
    Type: 'AWS::EC2::SecurityGroupEgress'
    Properties:
      CidrIp: !FindInMap 
        - CIDR
        - All
        - IP
      GroupId: !Ref SecurityGroupBastionInstance
      IpProtocol: '-1'
  SecurityGroupNATInstance:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Security Group for NAT instance.
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-SecurityGroupNAT'
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      VpcId: !Ref VPC
  SecurityGroupNATInstanceIngressPrivateSubnet1Http:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      CidrIp: !FindInMap 
        - CIDR
        - PrivateSubnet1
        - IP
      FromPort: 80
      ToPort: 80
      GroupId: !Ref SecurityGroupNATInstance
      IpProtocol: tcp
  SecurityGroupNATInstanceIngressPrivateSubnet2Http:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      CidrIp: !FindInMap 
        - CIDR
        - PrivateSubnet2
        - IP
      FromPort: 80
      ToPort: 80
      GroupId: !Ref SecurityGroupNATInstance
      IpProtocol: tcp
  SecurityGroupNATInstanceIngressPrivateSubnet1Https:
    Type: 'AWS::EC2::SecurityGroupIngress'
    Properties:
      CidrIp: !FindInMap 
        - CIDR
        - PrivateSubnet1
        - IP
      FromPort: 443
