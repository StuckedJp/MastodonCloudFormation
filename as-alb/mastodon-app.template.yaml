AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation template file for Mastodon (Application layer).
Parameters:
  Tag1Key:
    Description: Tag key
    Type: String
  Tag1Value:
    Description: Tag value
    Type: String
  Tag2Key:
    Description: Tag key
    Type: String
  Tag2Value:
    Description: Tag value
    Type: String
  InfraStackName:
    Description: Stack name of infrastructure.
    Type: String
  MastodonFQDN:
    Description: FQDN of mastodon
    Type: String
  InstanceType:
    Description: Mastodon WebServer EC2 instance type
    Type: String
    Default: t2.micro
    ConstraintDescription: must be a valid EC2 instance type.
  InstanceAMI:
    Description: Mastodon WebServer EC2 instance AMI ID
    Type: 'AWS::EC2::Image::Id'
    ConstraintDescription: must be a valid EC2 AMI ID.
  EC2KeyPair:
    Description: Mastodon WebServer EC2 Key Pair Name
    Type: 'AWS::EC2::KeyPair::KeyName'
    ConstraintDescription: must be a valid EC2 Key Pair Name.
  PackageS3Bucket:
    Description: S3 bucket name for Mastodon pre-build package.
    Type: String
    ConstraintDescription: must be a valid S3 bucket name.
  PackageS3Prefix:
    Description: S3 folder name for Mastodon pre-build package.
    Type: String
    ConstraintDescription: must be a valid S3 key name.
  PackageName:
    Description: File name for Mastodon pre-build package.
    Type: String
    ConstraintDescription: must be a valid file name.
  ContentsS3Bucket:
    Description: S3 bucket name of content cache.
    Type: String
    ConstraintDescription: must be a valid S3 bucket name.
  LBAccessLogS3Bucket:
    Description: S3 bucket name of access log of load balancer.
    Type: String
    ConstraintDescription: must be a valid S3 bucket name.
  LBAccessLogPrefix:
    Description: Prefix of access log of load balancer.
    Type: String
  CertArn:
    Description: ARN of server certificate on ACM.
    Type: String
    ConstraintDescription: must be a valid ACM ARN.
Mappings:
  CIDR:
    VPC:
      IP: 10.0.0.0/16
    PrivateSubnet1:
      IP: 10.0.10.0/24
    PrivateSubnet2:
      IP: 10.0.11.0/24
    PublicSubnet1:
      IP: 10.0.20.0/24
    PublicSubnet2:
      IP: 10.0.21.0/24
    All:
      IP: 0.0.0.0/0
  InstanceConfig:
    Storage:
      ValueByGb: '20'
Conditions:
  IsVirginia: !Equals 
    - !Ref 'AWS::Region'
    - us-east-1
Resources:
  MastodonInstanceIAMRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: 's3:*'
                Resource: !Sub arn:aws:s3:::${ContentsS3Bucket}
              - Effect: Allow
                Action: 's3:*'
                Resource: !Sub arn:aws:s3:::${ContentsS3Bucket}/*
              - Effect: Allow
                Action: 's3:*'
                Resource: !Sub arn:aws:s3:::${PackageS3Bucket}
              - Effect: Allow
                Action: 's3:*'
                Resource: !Sub arn:aws:s3:::${PackageS3Bucket}/*
              - Effect: Allow
                Action: 'acm:*'
                Resource: !Ref CertArn
  MastodonInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Roles:
        - !Ref MastodonInstanceIAMRole
  MastodonInstanceApplicationLoadBalancerTargetGroupHttp:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      HealthCheckIntervalSeconds: 60
      HealthCheckPath: /about
      HealthCheckPort: '80'
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: 200-399
      Name: !Sub ${AWS::StackName}-alb-tg
      Port: 80
      Protocol: HTTP
      Tags:
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: 'true'
        - Key: stickiness.type
          Value: lb_cookie
      VpcId: !ImportValue 
        'Fn::Sub': '${InfraStackName}-VPC'
  MastodonInstanceApplicationLoadBalancer:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: true
        - Key: access_logs.s3.bucket
          Value: !Ref LBAccessLogS3Bucket
        - Key: access_logs.s3.prefix
          Value: !Ref LBAccessLogPrefix
      Name: !Join 
        - '-'
        - - !Ref 'AWS::StackName'
          - instance
          - alb
      Scheme: internet-facing
      SecurityGroups:
        - !ImportValue 
          'Fn::Sub': '${InfraStackName}-SecurityGroupMastodonInstance'
      Subnets:
        - !ImportValue 
          'Fn::Sub': '${InfraStackName}-PublicSubnet1'
        - !ImportValue 
          'Fn::Sub': '${InfraStackName}-PublicSubnet2'
      Tags:
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
      IpAddressType: dualstack
  MastodonInstanceApplicationLoadBalancerListenerHttps:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      Certificates:
        - CertificateArn: !Ref CertArn
      DefaultActions:
        - TargetGroupArn: !Ref MastodonInstanceApplicationLoadBalancerTargetGroupHttp
          Type: forward
      LoadBalancerArn: !Ref MastodonInstanceApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-2016-08
  MastodonInstanceApplicationLoadBalancerListenerHttp:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      DefaultActions:
        - TargetGroupArn: !Ref MastodonInstanceApplicationLoadBalancerTargetGroupHttp
          Type: forward
      LoadBalancerArn: !Ref MastodonInstanceApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
  MastodonInstanceAutoScalingLaunchConfig:
    Type: 'AWS::AutoScaling::LaunchConfiguration'
    Properties:
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            VolumeSize: !FindInMap [ InstanceConfig, Storage, ValueByGb ]
      IamInstanceProfile: !Ref MastodonInstanceProfile
      ImageId: !Ref InstanceAMI
      InstanceMonitoring: true
      InstanceType: !Ref InstanceType
      KeyName: !Ref EC2KeyPair
      SecurityGroups:
        - !ImportValue 
          'Fn::Sub': '${InfraStackName}-SecurityGroupMastodonInstance'
      UserData: !Base64 
        'Fn::Join':
          - ''
          - - |
              #!/bin/bash -xe
            - |
              # ********** Install packages for cloud formation **********
            - |
              export HOME=/root 
            - |
              apt-get update 
            - |
              DEBIAN_FRONTEND=noninteractive apt-get -yq upgrade
            - |
              apt-get -y install python-pip python-setuptools 
            - |
              pip install --upgrade pip awscli 
            - |
              cd /root 
            - |
              mkdir aws-cfn-bootstrap-latest
            - |
              curl https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-latest.tar.gz | tar xz -C aws-cfn-bootstrap-latest --strip-components 1 
            - |
              python /usr/lib/python2.7/dist-packages/easy_install.py aws-cfn-bootstrap-latest
            - |
              ln -s /root/aws-cfn-bootstrap-latest/init/ubuntu/cfn-hup /etc/init.d/cfn-hup 

            - |
              # ********** Install required packages **********
            - |
              curl -sL https://deb.nodesource.com/setup_8.x | bash -
            - |
              curl -sS https://dl.yarnpkg.com/debian/pubkey.gpg | apt-key add -
            - |
              echo "deb https://dl.yarnpkg.com/debian/ stable main" > /etc/apt/sources.list.d/yarn.list
            - |
              apt-add-repository -y ppa:brightbox/ruby-ng
            - |
              apt-get update
            - '/usr/local/bin/cfn-init -v '
            - ' --stack '
            - !Ref 'AWS::StackName'
            - ' --resource MastodonInstanceAutoScalingLaunchConfig '
            - ' --configsets installPackages '
            - ' --region '
            - !Ref 'AWS::Region'
            - |+

            - |
              gem update --system
            - |
              gem install bundler:1.17.3
            - |
              # ********** Add mastodon user **********
            - |
              useradd -d /home/mastodon --create-home --user-group mastodon

            - |
              # ********** Download pre-builded Mastodon **********
            - |
              cd /home/mastodon 
            - !Sub >
              aws s3 cp
              s3://${PackageS3Bucket}/${PackageS3Prefix}/${PackageName}
              ${PackageName} 
            - !Sub |
              tar xfz ${PackageName} 
            - 'chown -R mastodon:mastodon '
            - !Ref MastodonFQDN
            - |2
               
            - |
              # ********** Install config files **********
            - '/usr/local/bin/cfn-init -v '
            - ' --stack '
            - !Ref 'AWS::StackName'
            - ' --resource MastodonInstanceAutoScalingLaunchConfig '
            - ' --configsets createConfigFiles '
            - ' --region '
            - !Ref 'AWS::Region'
            - |+

            - |
              # ********** Configure systemd for mastodon **********
            - |
              systemctl enable /etc/systemd/system/mastodon-*.service
            - |
              # ********** Setup Nginx **********
            - ln -s /etc/nginx/sites-available/mastodon
            - |2
                    /etc/nginx/sites-enabled/mastodon
            - |
              rm -f /etc/nginx/sites-enabled/default 
            - |
              # ********** Restart system **********
            - |
              reboot 
            - |
              # ********** The End **********
    Metadata:
      'AWS::CloudFormation::Init':
        configSets:
          installPackages:
            - aptPackages
          createConfigFiles:
            - systemd-mastodon-web
            - systemd-mastodon-sidekiq
            - systemd-mastodon-stream
            - nginx-domain
            - cron-daily
        aptPackages:
          packages:
            apt:
              imagemagick : []
              ffmpeg : []
              libpq-dev : []
              libxml2-dev : []
              libxslt1-dev : []
              file : []
              git-core : []
              g++ : []
              libprotobuf-dev : []
              protobuf-compiler : []
              pkg-config : []
              nodejs : []
              gcc : []
              autoconf : []
              bison : []
              build-essential : []
              libssl-dev : []
              libyaml-dev : []
              libreadline6-dev : []
              zlib1g-dev : []
              libncurses5-dev : []
              libffi-dev : []
              libgdbm5 : []
              libgdbm-dev : []
              nginx : []
              redis-tools : []
              postgresql-contrib : []
              certbot : []
              yarn : []
              libidn11-dev : []
              libicu-dev : []
              libjemalloc-dev : []
              ruby2.6: []
              ruby2.6-dev: []
        systemd-mastodon-web:
          files:
            /etc/systemd/system/mastodon-web.service:
              content: !Join 
                - ''
                - - |
                    [Unit]
                  - |
                    Description=mastodon-web
                  - |
                    After=network.target
                  - |+

                  - |
                    [Service]
                  - |
                    Type=simple
                  - |
                    User=mastodon
                  - WorkingDirectory=/home/mastodon/
                  - !Ref MastodonFQDN
                  - |+

                  - |
                    Environment="RAILS_ENV=production"
                  - |
                    Environment="PORT=3000"
                  - |
                    ExecStart=/usr/local/bin/bundle exec puma -C config/puma.rb
                  - |
                    ExecReload=/bin/kill -SIGUSR1 $MAINPID
                  - |
                    TimeoutSec=15
                  - |
                    Restart=always
                  - |+

                  - |
                    [Install]
                  - |
                    WantedBy=multi-user.target
              mode: '000644'
              owner: root
              group: root
        systemd-mastodon-sidekiq:
          files:
            /etc/systemd/system/mastodon-sidekiq.service:
              content: !Join 
                - ''
                - - |
                    [Unit]
                  - |
                    Description=mastodon-sidekiq
                  - |
                    After=network.target
                  - |+

                  - |
                    [Service]
                  - |
                    Type=simple
                  - |
                    User=mastodon
                  - WorkingDirectory=/home/mastodon/
                  - !Ref MastodonFQDN
                  - |+

                  - |
                    Environment="RAILS_ENV=production"
                  - |
                    Environment="DB_POOL=25"
                  - |
                    Environment="MALLOC_ARENA_MAX=2"
                  - |
                    ExecStart=/usr/local/bin/bundle exec sidekiq -c 25
                  - |
                    TimeoutSec=15
                  - |
                    Restart=always
                  - |+

                  - |
                    [Install]
                  - |
                    WantedBy=multi-user.target
              mode: '000644'
              owner: root
              group: root
        systemd-mastodon-stream:
          files:
            /etc/systemd/system/mastodon-streaming.service:
              content: !Join 
                - ''
                - - |
                    [Unit]
                  - |
                    Description=mastodon-streaming
                  - |
                    After=network.target
                  - |+

                  - |
                    [Service]
                  - |
                    Type=simple
                  - |
                    User=mastodon
                  - WorkingDirectory=/home/mastodon/
                  - !Ref MastodonFQDN
                  - |+

                  - |
                    Environment="NODE_ENV=production"
                  - |
                    Environment="PORT=4000"
                  - |
                    Environment="STREAMING_CLUSTER_NUM=1"
                  - |
                    ExecStart=/usr/bin/npm run start
                  - |
                    TimeoutSec=15
                  - |
                    Restart=always
                  - |+

                  - |
                    [Install]
                  - |
                    WantedBy=multi-user.target
              mode: '000644'
              owner: root
              group: root
        nginx-domain:
          files:
            /etc/nginx/sites-available/mastodon:
              content: !Join 
                - ''
                - - |
                    map $http_upgrade $connection_upgrade {
                  - |2
                      default upgrade;
                  - |2
                      ''      close;
                  - |
                    }
                  - |+

                  - |
                    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=CACHE:10m inactive=7d max_size=1g;
                  - |+

                  - |
                    server {
                  - |2
                      listen 80;
                  - |2
                      listen [::]:80;
                  - '  server_name '
                  - !Ref MastodonFQDN
                  - |
                    ;
                  - |+

                  - |2
                      # Useful for Let's Encrypt
                  - |2
                      location /.well-known/acme-challenge/ { allow all; }
                  - |2
                      # location / { return 301 https://$host$request_uri; }
                  - |+

                  - |2
                      keepalive_timeout    70;
                  - |2
                      sendfile             on;
                  - |2
                      client_max_body_size 80m;
                  - |+

                  - '  root /home/mastodon/'
                  - !Ref MastodonFQDN
                  - |
                    /public;
                  - |+

                  - |2
                      gzip on;
                  - |2
                      gzip_disable "msie6";
                  - |2
                      gzip_vary on;
                  - |2
                      gzip_proxied any;
                  - |2
                      gzip_comp_level 6;
                  - |2
                      gzip_buffers 16 8k;
                  - |2
                      gzip_http_version 1.1;
                  - |2
                      gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
                  - |+

                  - |2
                      add_header Strict-Transport-Security "max-age=31536000";
                  - |+

                  - |2
                      location / {
                  - |2
                        try_files $uri @proxy;
                  - |2
                      }
                  - |+

                  - |2
                      location ~ ^/(emoji|packs|system/accounts/avatars|system/media_attachments/files) {
                  - |2
                        add_header Cache-Control "public, max-age=31536000, immutable";
                  - |2
                        add_header Strict-Transport-Security "max-age=31536000";
                  - |2
                        try_files $uri @proxy;
                  - |2
                      }
                  - |+

                  - |2
                      location /sw.js {
                  - |2
                        add_header Cache-Control "public, max-age=0";
                  - |2
                        add_header Strict-Transport-Security "max-age=31536000";
                  - |2
                        try_files $uri @proxy;
                  - |2
                      }
                  - |+

                  - |2
                      location @proxy {
                  - |2
                        proxy_set_header Host $host;
                  - |2
                        proxy_set_header X-Real-IP $remote_addr;
                  - |2
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  - |2
                        proxy_set_header X-Forwarded-Proto https;
                  - |2
                        proxy_set_header Proxy "";
                  - |2
                        proxy_pass_header Server;
                  - |+

                  - |2
                        proxy_pass http://127.0.0.1:3000;
                  - |2
                        proxy_buffering on;
                  - |2
                        proxy_redirect off;
                  - |2
                        proxy_http_version 1.1;
                  - |2
                        proxy_set_header Upgrade $http_upgrade;
                  - |2
                        proxy_set_header Connection $connection_upgrade;
                  - |+

                  - |2
                        proxy_cache CACHE;
                  - |2
                        proxy_cache_valid 200 7d;
                  - |2
                        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
                  - |2
                        add_header X-Cached $upstream_cache_status;
                  - |2
                        add_header Strict-Transport-Security "max-age=31536000";
                  - |+

                  - |2
                        tcp_nodelay on;
                  - |2
                      }
                  - |+

                  - |2
                      location /api/v1/streaming {
                  - |2
                        proxy_set_header Host $host;
                  - |2
                        proxy_set_header X-Real-IP $remote_addr;
                  - |2
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  - |2
                        proxy_set_header X-Forwarded-Proto https;
                  - |2
                        proxy_set_header Proxy "";
                  - |+

                  - |2
                        proxy_pass http://127.0.0.1:4000;
                  - |2
                        proxy_buffering off;
                  - |2
                        proxy_redirect off;
                  - |2
                        proxy_http_version 1.1;
                  - |2
                        proxy_set_header Upgrade $http_upgrade;
                  - |2
                        proxy_set_header Connection $connection_upgrade;
                  - |+

                  - |2
                        tcp_nodelay on;
                  - |2
                      }
                  - |+

                  - |2
                      error_page 500 501 502 503 504 /500.html;
                  - |
                    }
              mode: '000644'
              owner: root
              group: root
        cron-daily:
          files:
            /home/mastodon/mastodon.daily.sh:
              content: !Join 
                - ''
                - - cd /home/mastodon/
                  - !Ref MastodonFQDN
                  - |+

                  - >
                    RAILS_ENV=production /usr/local/bin/bundle exec rake
                    mastodon:daily > /dev/null
              mode: '000755'
              owner: mastodon
              group: mastodon
  MastodonInstanceAutoScalingGroup:
    Type: 'AWS::AutoScaling::AutoScalingGroup'
    Properties:
      AvailabilityZones:
        - !ImportValue 
          'Fn::Sub': '${InfraStackName}-SubnetAvailabilityZone1'
        - !ImportValue 
          'Fn::Sub': '${InfraStackName}-SubnetAvailabilityZone2'
      Cooldown: 600
      DesiredCapacity: 1
      HealthCheckGracePeriod: 600
      HealthCheckType: ELB
      LaunchConfigurationName: !Ref MastodonInstanceAutoScalingLaunchConfig
      MaxSize: 12
      MinSize: 1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-Mastodon'
          PropagateAtLaunch: true
        - Key: !Ref Tag1Key
          Value: !Ref Tag1Value
          PropagateAtLaunch: true
        - Key: !Ref Tag2Key
          Value: !Ref Tag2Value
          PropagateAtLaunch: true
      TargetGroupARNs:
        - !Ref MastodonInstanceApplicationLoadBalancerTargetGroupHttp
      TerminationPolicies:
        - Default
      VPCZoneIdentifier:
        - !ImportValue 
          'Fn::Sub': '${InfraStackName}-PrivateSubnet1'
        - !ImportValue 
          'Fn::Sub': '${InfraStackName}-PrivateSubnet2'
Outputs:
  MastodonInstanceHostName:
    Description: Host name of Mastodon instance
    Value: !GetAtt 
      - MastodonInstanceApplicationLoadBalancer
      - DNSName

